name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # creating the release and uploading its assets
  id-token: write # Sigstore OIDC, for the build provenance attestation
  attestations: write # recording that attestation against this repository

jobs:
  # The published platforms: wherever Panic ships a Simulator. No linux/arm64 or
  # windows/arm64, because Panic ships no ARM64 SDK for either.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The install skill picks assets by the manifest's version, so the tag must match it.
      - name: the tag matches plugin/plugin.json
        id: version
        run: |
          set -uo pipefail
          version=$(jq -er .version plugin/plugin.json) || exit 1
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin/plugin.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No leading "v" in the asset name: the tag is v0.1.0 and the asset is 0.1.0.
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          name="open-crank-mcp_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            name="${name}.exe"
          fi
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${name}" ./cmd/open-crank-mcp || exit 1
          echo "built ${name}"

      # The Playdate SDK License bans redistributing the SDK, so the embedded files
      # must be only our own harness source.
      - name: nothing but our own code is embedded
        run: go test -count=1 -run 'TestHarnessFS' .

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/open-crank-mcp_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the build jobs' binaries land here, so no SDK file can reach the release.
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      # Checkable with `sha256sum -c` or `shasum -a 256 -c`. Integrity only; origin is the attestation.
      - name: checksums
        run: |
          set -uo pipefail
          cd dist || exit 1
          sha256sum -- open-crank-mcp_* > checksums.txt || exit 1
          cat checksums.txt

      # Keyless Sigstore; verify with `gh attestation verify --owner NickSpaghetti <file>`.
      # Subjects from checksums.txt, so the signature covers the list users check against.
      - name: attest the binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

      # A hyphen in the version means a semver prerelease. gh does not infer it, so
      # without --prerelease v0.1.0-rc would publish as the latest stable release.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LICENSE dist/
          ls -l dist/
          prerelease=""
          case "${GITHUB_REF_NAME#v}" in
            *-*) prerelease="--prerelease" ;;
          esac
          echo "publishing $GITHUB_REF_NAME ${prerelease:-as a full release}"

          # A release published in the UI creates the tag, so the release may already
          # exist. `view` first, so a bad token doesn't look like "already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; uploading assets to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag $prerelease
          fi
