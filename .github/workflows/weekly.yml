name: Weekly SDK Sweep

on:
  schedule:
    # Monday 2AM UTC (Sunday 9PM EST); Actions cron is UTC and ignores DST.
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

# Container-only: the sweep varies PLAYDATE_SDK_VERSION, a Docker build arg,
# across the pin and Panic's `latest` alias.
jobs:
  sdk-contract-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk_version: ['3.1.2', 'latest']
    steps:
      - uses: actions/checkout@v7
      - run: make sdk-contract-check PLAYDATE_SDK_VERSION=${{ matrix.sdk_version }}

  # The sweep proves `latest` works, not that the pin is current.
  sdk-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make sdk-pin-check

  # Upstream Agent Plugins drift against the vendored plugin/schemas/.
  plugin-upstream-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make plugin-upstream-check
