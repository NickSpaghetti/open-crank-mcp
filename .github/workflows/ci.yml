name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            PLAYDATE_SDK_VERSION=3.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  test-c-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-c-harness

  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke-check

  sdk-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            harness:
              - 'c-harness/**'
              - 'lua/**'
              - 'internal/harness/**'
              - 'internal/simulator/**'
              - 'internal/build/**'
              - 'internal/screenshot/**'
              - 'internal/contracttest/**'
      # The job always runs so this required check always resolves. A
      # workflow-level `paths:` trigger would instead leave it permanently
      # pending, and merges blocked, on PRs that don't touch these paths.
      - if: steps.filter.outputs.harness == 'true'
        run: make sdk-contract-check

  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-gremlins/gremlins-action@v1
        with:
          version: v0.6.0
