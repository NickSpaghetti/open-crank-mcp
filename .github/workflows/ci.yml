name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            PLAYDATE_SDK_VERSION=3.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Builds and vets for linux, darwin and windows. Catches a platform-specific
  # construct used outside a build-tag file, which is otherwise invisible until
  # someone with that OS tries it. Cheap, and no Docker.
  go-build-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make go-build-cross

  # Every relative Markdown link and heading anchor resolves. bash and grep, no toolchain
  # and no network - external URLs are deliberately not fetched, so this cannot fail
  # because someone else's site is down.
  #
  # Its own job rather than a step on another, because it is the only check that a
  # docs-only pull request has any reason to run, and burying it in a job that installs Go
  # would make a typo fix wait on a toolchain.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-doc-links

  # Native mode: the server running against an SDK installed on the machine,
  # with no container anywhere. Everything else here proves the containerized
  # path; this is the only job that proves the other one.
  #
  # The apt line below is the authoritative list of what the Simulator needs on
  # a bare host. The README's native requirements point at this job rather than
  # repeating it, so the two cannot drift.
  #
  # Fetching the SDK onto the runner is not a new licence posture: docker-build
  # already fetches the same archive from the same place on every run. The
  # difference is only that it lands on the runner instead of in an image layer.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Taken from the Dockerfile's list, minus the VNC and audio-streaming
      # extras that only the shared profile needs. xvfb because a GitHub runner
      # has no display; cmake and build-essential because a C game builds
      # through the SDK's CMake support.
      - name: install what the Simulator needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libgtk-3-0 \
            libnotify4 libnss3 libxss1 libxtst6 at-spi2-core libsecret-1-0 \
            libpulse0 xvfb cmake build-essential

      # Extracted to the default location internal/sdk looks in, deliberately.
      # Setting PLAYDATE_SDK_PATH would make this job prove only that an
      # environment variable works, which the container already proves. Landing
      # it where a person's installer would put it exercises the detection this
      # checkpoint exists for.
      - name: install the Playdate SDK
        run: |
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            -o /tmp/playdate-sdk.tar.gz
          mkdir -p "$HOME/PlaydateSDK"
          tar -xzf /tmp/playdate-sdk.tar.gz --strip-components=1 -C "$HOME/PlaydateSDK"
        env:
          PLAYDATE_SDK_VERSION: '3.1.1'

      # Fails loudly if detection found nothing, and prints which source won.
      # First because everything after it depends on the answer, and because a
      # detection regression is the failure this job most needs to catch.
      - run: make sdk-path

      - run: make go-build

      # No xvfb-run wrapper. Both of these start their own Xvfb already
      # (cmd/smoke-check/display_linux.go and internal/contracttest's own
      # helper), so wrapping them would nest a second server and could collide
      # on a display number. The xvfb *package* is still required above, because
      # that is where the binary they launch comes from.
      #
      # SDL_AUDIODRIVER=dummy for the same reason Dockerfile sets it on the
      # headless image: the Simulator treats SDL initialisation as fatal, and a
      # runner has no audio device at all. Without this, SDL works down its
      # driver list to OSS and dies with "dsp: No such audio device", which reads
      # like an SDK or display problem and is neither. A developer's desktop has
      # a real device and needs none of this; anything headless does.
      - run: make smoke-check-native
        env:
          SDL_AUDIODRIVER: dummy
      - run: make sdk-contract-check-native
        id: contract
        env:
          SDL_AUDIODRIVER: dummy

      # Runs only when the contract tests failed, and only to say *how*. The two
      # failure shapes seen so far need different answers and the test output
      # cannot tell them apart:
      #
      #   - a data directory that exists and holds mcp/ means the harness ran and
      #     the location is right, so the round trip is what is broken - most
      #     likely the per-frame update never ticking, which on this platform
      #     would mean the Simulator is loading games without running them.
      #   - no data directory at all means the harness never got that far, or it
      #     is writing somewhere this does not look.
      #
      # Whichever it is, the tree below distinguishes them in one run instead of
      # a push per guess.
  # macOS, natively. Everything here passes; what is deliberately absent is
  # explained below, because the absence is the interesting part.
  #
  # What this proves, none of which any other job can:
  #
  #   - the SDK provisions non-interactively from Panic's .zip, via the .pkg it
  #     contains. The earlier claim that a macOS runner could not do this was
  #     simply wrong.
  #   - detection finds it the way a person's machine would, through the SDKRoot
  #     key in ~/.Playdate/config that the installer writes - not through an
  #     environment variable a CI file set for itself.
  #   - the .app bundle path resolves to the inner Mach-O, which is the value in
  #     internal/sdk that could not be verified by running until now.
  #   - internal/harness runs against kqueue rather than inotify, and
  #     internal/simulator's proc_unix.go against Darwin process handling. Every
  #     timing assumption in that code was formed on Linux.
  #   - smoke-check-native passes: the libraries resolve, pdc runs, and the
  #     Simulator starts and stays up.
  #
  # What is missing, and why: sdk-contract-check-native. Those tests need a game
  # to actually execute, and on a fresh macOS install the Simulator opens a
  # first-run modal - "Heads up! Regularly test your game on a Playdate during
  # development" - and waits on it forever. A screenshot from CI confirms it
  # directly. The game loads behind the dialog and never ticks, which is why the
  # C harness gets its directory created at kEventInit while the Lua harness,
  # which needs main.lua to run, gets nothing.
  #
  # Ruled out along the way, so nobody repeats it: it is not timing (25s is no
  # better than 5s), not the launch method (`open -a` behaves identically), not
  # focus (the Simulator activates and the dialog stays), and not a missing GUI
  # session (`launchctl managername` reports Aqua). Writing ShowPerfWarning into
  # ~/Library/Preferences/date.play.simulator.plist does not suppress it either,
  # as a boolean or as the string "0", even though that plist is demonstrably
  # what the Simulator reads and rewrites. The Linux INI equivalent in
  # run-vnc.sh does work, so either the key differs on macOS or the dialog is
  # gated on something else entirely.
  #
  # Finding the real key needs someone at a Mac who can dismiss the dialog once
  # and diff the plist. Until then this job covers everything up to running a
  # game, which is most of what it was added for. See docs/GOTCHAS.md.
  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make go-build
      - run: make go-test

      # Pinned rather than PlaydateSDK-latest.zip, so this job fails when the
      # SDK changes under it instead of drifting silently.
      - name: install the Playdate SDK
        run: |
          curl -fsSL "https://download.panic.com/playdate_sdk/PlaydateSDK-${PLAYDATE_SDK_VERSION}.zip" \
            -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          sudo installer -pkg /tmp/sdk/PlaydateSDK.pkg -target /
        env:
          PLAYDATE_SDK_VERSION: '3.1.1'

      # Fails loudly if detection found nothing, and prints which of the three
      # sources won. A detection regression is the failure this job most needs
      # to catch, and it is invisible everywhere else.
      - run: make sdk-path

      # SDL_AUDIODRIVER=dummy for the same reason the Linux native job sets it:
      # the Simulator treats SDL initialisation as fatal and a runner has no
      # audio device.
      - run: make smoke-check-native
        env:
          SDL_AUDIODRIVER: dummy


  # What only this job can cover, whether or not the SDK steps work:
  #
  #   - internal/harness runs against kqueue instead of inotify. fsnotify
  #     abstracts them, but the semantics differ, and every timing assumption in
  #     that package was formed on Linux. The backstop re-check in awaitPath
  #     exists for a kqueue behaviour that could not be tested from Linux.
  #   - internal/simulator's proc_unix.go runs on Darwin's process handling.
  #   - the darwin path layout is exercised natively rather than cross-compiled,
  #     against a real install rather than an fstest.MapFS.

  test-c-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-c-harness

  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke-check

  # Specmatic's MCP auto-test against the real tool surface, over the -http transport.
  # Generates inputs from each tool's own declared schema, mutates them, and checks the
  # server rejects what it should. No spec file: it reads tools/list off the running
  # server, so there is no second artifact to keep in sync.
  #
  # Advisory to start with. Not because its findings are unimportant - it is what found
  # the missing enums and setup's unchecked directory writes - but because it is a
  # third-party container whose output format this depends on, and a first-party check
  # should earn a merge gate by being seen green over time. Promote it by dropping
  # continue-on-error and adding it to main's required checks; the golden-schema half of
  # the same work already gates through go-test.
  #
  # Deliberately not conditional on paths. The tool surface can change from almost
  # anywhere in internal/, and this is cheap next to the container jobs above.
  mcp-auto-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mcp-auto-test
      # Kept whichever way the run went: a passing run's report is how the coverage it
      # claims gets checked, and a failing one's is the only place the per-tool verdicts
      # live.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-auto-test-report
          path: build/reports/specmatic/
          if-no-files-found: warn

  sdk-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A filter that names a path which no longer exists matches nothing, and
      # the job goes green having tested nothing. Nothing else notices, because
      # a skipped step and a passing step look identical from outside. This
      # fails the job instead.
      - name: paths-filter globs still resolve
        run: |
          missing=0
          for p in c-harness lua internal/harness internal/simulator internal/build internal/screenshot internal/contracttest; do
            [ -e "$p" ] || { echo "paths-filter references a missing path: $p"; missing=1; }
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            harness:
              - 'c-harness/**'
              - 'lua/**'
              - 'internal/harness/**'
              - 'internal/simulator/**'
              - 'internal/build/**'
              - 'internal/screenshot/**'
              - 'internal/contracttest/**'
      # The job always runs so this required check always resolves. A
      # workflow-level `paths:` trigger would instead leave it permanently
      # pending, and merges blocked, on PRs that don't touch these paths.
      - if: steps.filter.outputs.harness == 'true'
        run: make sdk-contract-check

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pure awk and bash, so this runs whether or not anything else does.
      - run: make test-shared-unit
      # A filter that names a path which no longer exists matches nothing, and
      # the job goes green having tested nothing. Nothing else notices, because
      # a skipped step and a passing step look identical from outside. This
      # fails the job instead.
      - name: paths-filter globs still resolve
        run: |
          missing=0
          for p in scripts tests/browser docker-compose.yml Dockerfile; do
            [ -e "$p" ] || { echo "paths-filter references a missing path: $p"; missing=1; }
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              # scripts/** rather than four named files. Five of the six files
              # in there are this stack, so a change to the sixth firing this
              # leg is a cheap false positive - whereas renaming one of the four
              # and forgetting to update this list would silently stop the leg
              # firing, and the check would stay green while testing nothing.
              # That nearly happened when byos was renamed to shared.
              - 'scripts/**'
              - 'tests/browser/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
      # Same reason as sdk-contract-check: the job always runs so the required
      # check resolves, and only the expensive part is conditional. This one
      # builds the image, boots the container and drives a browser, so it isn't
      # worth doing on a docs-only change.
      #
      # test-shared-browser runs shared-check itself, so the container and its
      # image are only built once.
      # Typechecking is cheap and has no container to boot, so it runs on every
      # change to the browser tests rather than only when the shared profile
      # itself changes.
      - run: make test-shared-types
      - if: steps.filter.outputs.shared == 'true'
        run: make test-shared-browser

  # Mutation testing runs as two jobs on two runners, because one runner has not
  # survived mutating the whole module since internal/scan landed - see the note
  # above mutation-test-rest in the Makefile for what was measured and ruled out.
  #
  # Deliberately two named jobs rather than one matrixed job. A matrix would
  # rename the checks to "mutation-test (rest)" and "mutation-test (scan)", and
  # "mutation-test" is a required status check on main - it would never report
  # again and every PR would block on it forever. This keeps that name attached
  # to the larger half and adds the new one alongside, so branch protection
  # keeps working untouched and mutation-test-scan can be made required later.
  #
  # Both run the make targets rather than gremlins-action, so CI and a local run
  # read the same .gremlins.yaml.
  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mutation-test-rest

  mutation-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mutation-test-scan
