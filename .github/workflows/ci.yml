name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            PLAYDATE_SDK_VERSION=3.1.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Catches a platform-specific construct used outside a build-tagged file.
  go-build-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make go-build-cross

  # Duplicates part of go-test so a rejected manifest fails a job named "plugin".
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make plugin-check

  # Its own job, so a docs-only PR doesn't wait on a Go toolchain.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-doc-links

  # Native mode on Linux: the server against a host-installed SDK, no container.
  # The apt line below is the list the README points to for native requirements.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Dockerfile's list minus the shared-profile extras.
      - name: install what the Simulator needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libgtk-3-0 \
            libnotify4 libnss3 libxss1 libxtst6 at-spi2-core libsecret-1-0 \
            libpulse0 xvfb cmake build-essential

      # The default location rather than PLAYDATE_SDK_PATH, to exercise detection.
      - name: install the Playdate SDK
        run: |
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            -o /tmp/playdate-sdk.tar.gz
          mkdir -p "$HOME/PlaydateSDK"
          tar -xzf /tmp/playdate-sdk.tar.gz --strip-components=1 -C "$HOME/PlaydateSDK"
        env:
          PLAYDATE_SDK_VERSION: '3.1.2'

      - run: make sdk-path

      - run: make go-build

      # No xvfb-run: both start their own Xvfb. SDL_AUDIODRIVER=dummy because the
      # runner has no audio device and the Simulator treats SDL init failure as fatal.
      - run: make smoke-check-native
        env:
          SDL_AUDIODRIVER: dummy
      - run: make sdk-contract-check-native
        env:
          SDL_AUDIODRIVER: dummy

  # Native macOS: installer-based detection, kqueue and Darwin process handling.
  # No sdk-contract-check-native: a fresh macOS Simulator blocks games behind a
  # first-run modal that ShowPerfWarning in its plist doesn't suppress. See docs/GOTCHAS.md.
  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make go-build
      - run: make go-test

      # Pinned rather than PlaydateSDK-latest.zip, so this job fails when the
      # SDK changes under it instead of drifting silently.
      - name: install the Playdate SDK
        run: |
          curl -fsSL "https://download.panic.com/playdate_sdk/PlaydateSDK-${PLAYDATE_SDK_VERSION}.zip" \
            -o /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          sudo installer -pkg /tmp/sdk/PlaydateSDK.pkg -target /
        env:
          PLAYDATE_SDK_VERSION: '3.1.2'

      - run: make sdk-path

      # Same reason as the Linux native job.
      - run: make smoke-check-native
        env:
          SDL_AUDIODRIVER: dummy

  # The PowerShell script is also the local command on a Windows host.
  windows-native:
    runs-on: windows-latest
    env:
      PLAYDATE_SDK_VERSION: 3.1.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Playdate SDK
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:RUNNER_TEMP "PlaydateSDK"
          $installer = Join-Path $env:RUNNER_TEMP "PlaydateSDK-$env:PLAYDATE_SDK_VERSION.exe"
          $url = "https://download.panic.com/playdate_sdk/Windows/PlaydateSDK-$env:PLAYDATE_SDK_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$sdkPath") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Playdate SDK installer failed with exit code $($process.ExitCode)"
          }
          foreach ($binary in @("pdc.exe", "PlaydateSimulator.exe")) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdkPath "bin\$binary"))) {
              throw "Playdate SDK install is missing bin\$binary"
            }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PLAYDATE_SDK_PATH=$sdkPath`n")
          Remove-Item $installer -Force
      - name: Test Windows native server and MCP fixtures
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-windows-native.ps1

  test-c-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-c-harness

  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke-check

  # Advisory: it depends on a third-party container's output format. Not path-filtered,
  # since the tool surface can change from almost anywhere in internal/.
  mcp-auto-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mcp-auto-test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-auto-test-report
          path: build/reports/specmatic/
          if-no-files-found: warn

  sdk-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A filter naming a missing path matches nothing and passes silently.
      - name: paths-filter globs still resolve
        run: |
          missing=0
          for p in c-harness lua internal/harness internal/simulator internal/build internal/screenshot internal/contracttest; do
            [ -e "$p" ] || { echo "paths-filter references a missing path: $p"; missing=1; }
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            harness:
              - 'c-harness/**'
              - 'lua/**'
              - 'internal/harness/**'
              - 'internal/simulator/**'
              - 'internal/build/**'
              - 'internal/screenshot/**'
              - 'internal/contracttest/**'
      # Filtered per step, because a workflow-level `paths:` leaves a required check pending forever.
      - if: steps.filter.outputs.harness == 'true'
        run: make sdk-contract-check

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-shared-unit
      # A filter naming a missing path matches nothing and passes silently.
      - name: paths-filter globs still resolve
        run: |
          missing=0
          for p in scripts tests/browser docker-compose.yml Dockerfile; do
            [ -e "$p" ] || { echo "paths-filter references a missing path: $p"; missing=1; }
          done
          exit $missing
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              # A wildcard, so a renamed script can't silently stop this firing.
              - 'scripts/**'
              - 'tests/browser/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
      # Typechecking is cheap, so only test-shared-browser (which runs shared-check) is filtered.
      - run: make test-shared-types
      - if: steps.filter.outputs.shared == 'true'
        run: make test-shared-browser

  # Split across two runners (see mutation-test-scan in the Makefile). Named jobs, not
  # a matrix, which would rename the required "mutation-test" check and block every PR.
  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mutation-test-rest

  mutation-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make mutation-test-scan
