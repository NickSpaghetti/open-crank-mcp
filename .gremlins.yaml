mutants:
  # Only ever mutates internal/harness's two timing constants, where any positive
  # duration behaves the same, so there is nothing worth asserting.
  arithmetic-base: false

unleash:
  # Both bound mutants that hang, which internal/scan's byte loops always produce.
  # The timeout (~66s in CI) must fire before the runner kills a silent job
  # (seen at ~97s), so keep the coefficient at or below ~7. 2 workers limits cores lost to a hang.
  workers: 2
  timeout-coefficient: 5
  # gremlins v0.6.0 fails when value <= threshold, so 100 can never pass.
  threshold:
    efficacy: 90
    mutant-coverage: 90
  # Unanchored regexps against the relative path, not globs: "**" is a parse error
  # and a bare "main.go" matches every main.go.
  exclude-files:
    # Xvfb and the real Simulator binary; verified by `make smoke-check`.
    - "cmd/smoke-check/main.go"
    # Real cmake/pdc; verified by `make sdk-contract-check`. detect.go stays mutated.
    - "internal/build/exec.go"
    # build_game needs a real cmake/pdc toolchain.
    - "internal/tools/build.go"
    # launch_simulator needs a real .pdx and a real launchable binary.
    - "internal/tools/launch.go"
    # Starts a real Simulator and needs a display. The testable half is checks.go.
    - "internal/doctor/launch.go"
    # I/O composition whose every branch depends on a real SDK; report.go stays mutated.
    - "internal/doctor/gather.go"
    # Not compiled on Linux, where mutation testing runs.
    - "internal/doctor/libs_other.go"
    # Startup glue that wires the MCP server together.
    - "cmd/open-crank-mcp/main.go"
    # Prints sdk.Paths.Describe and exits.
    - "cmd/sdk-path/main.go"
    # Docker orchestration, unreachable without a real daemon.
    - "cmd/shared-load/main.go"
    # smoke-check's display halves: Xvfb and the real Simulator.
    - "cmd/smoke-check/display_linux.go"
    - "cmd/smoke-check/display_other.go"
    # Not compiled on Linux, where mutation testing runs.
    - "internal/simulator/proc_windows.go"
