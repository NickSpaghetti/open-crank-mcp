mutants:
  # Only ever mutates the two timing constants in internal/harness, and any
  # positive duration works identically for both, so there is nothing worth
  # asserting. They are the 1ms bootstrap poll (used once per launch, only while
  # the data directory does not exist yet) and the 10ms backstop re-check that
  # runs alongside the filesystem notification. Neither is a polling loop: the
  # wait blocks on a real notification. This comment used to say "the 100ms poll
  # interval", which stopped being true three changes ago.
  arithmetic-base: false

unleash:
  # The test suite has real sleep/poll-based tests (harness IPC, simulator
  # process lifecycle); high worker parallelism makes their wall-clock time
  # under gremlins' own load unpredictable enough to spuriously time out
  # against the default coefficient.
  #
  # workers was 4, and that took a GitHub runner down twice. internal/scan is
  # byte-loop code, so some mutants of it do not fail - they spin. The timeout
  # is what bounds a spin, and 10x a ~12s baseline is ~2 minutes of a pinned
  # core; with 4 workers on a 4-vCPU runner that starved the runner agent
  # itself, which GitHub reports as "the runner has received a shutdown
  # signal" rather than as anything about the tests. Half the workers leaves
  # cores free for the agent and for the other workers to drain.
  #
  # The loops that could spin have since been made to advance structurally
  # (see CMakeArgTokens and cLineCommentEnd), so this is defence in depth for
  # the next byte loop somebody writes, not the only thing holding it up.
  workers: 2
  timeout-coefficient: 10
  # gremlins v0.6.0 compares value <= threshold, so 100 can never pass even
  # at a perfect score (confirmed in its source). 90 leaves real headroom.
  threshold:
    efficacy: 90
    mutant-coverage: 90
  # exclude-files entries are REGEXPS, and unanchored ones at that, matched
  # against each file's path relative to the run directory. Not globs. A "**" in
  # here is a parse error, and a bare "main.go" silently matches every main.go in
  # the tree. Anchor with ^ unless a substring match is what you want.
  exclude-files:
    # OS-level process orchestration (Xvfb, ldd, the real PlaydateSimulator
    # binary). Not meaningfully unit-testable without the full simulator
    # Docker environment. Verified for real via `make smoke-check` instead.
    # Its one pure function (checkForErrors) has its own unit test.
    - "cmd/smoke-check/main.go"
    # Real cmake/pdc orchestration, same reasoning as above. Verified for
    # real via `make sdk-contract-check`. The pure detection/glob logic
    # lives in detect.go instead, and stays fully covered.
    - "internal/build/exec.go"
    # build_game needs a real cmake/pdc toolchain to build anything real;
    # the pure detection logic it calls into is already covered above.
    - "internal/tools/build.go"
    # launch_simulator needs a real .pdx's pdxinfo and a real launchable
    # binary. Every other simulator-lifecycle tool (stop/restart/status)
    # is fully unit-tested using a trivial stand-in process, the same
    # pattern internal/simulator's own tests use.
    - "internal/tools/launch.go"
    # Startup glue: reads an env var and wires the MCP server together.
    # internal/tools.RegisterAll (called from here) has its own test
    # confirming every tool's schema is valid.
    #
    # Every main.go below is listed by full path on purpose. This entry used to
    # read just "main.go", and because these patterns are unanchored regexps that
    # matched every main.go in the tree, silently excluding
    # cmd/shared-load/main.go and cmd/smoke-check/main.go as well.
    # The score it produced was therefore better than the config actually asked
    # for. Full paths mean each exclusion has to be argued for on its own.
    - "cmd/open-crank-mcp/main.go"
    # Prints sdk.Paths.Describe and exits. The rendering it used to hold inline
    # was moved into internal/sdk precisely so it could be mutation-tested; what
    # is left is the shell around it, same as the other commands here.
    - "cmd/sdk-path/main.go"
    # Docker orchestration: recreates the compose service, waits for PulseAudio,
    # then drives the MCP server over stdio. Nothing here is reachable without a
    # real daemon, and every branch is about a container's state rather than
    # logic of its own. Verified for real via `make shared-load` and
    # `make shared-check`.
    - "cmd/shared-load/main.go"
    # The platform halves of smoke-check, split out of its main.go, which was
    # already excluded above for exactly this reason: Xvfb, ldd and the real
    # Simulator binary. The exclusion follows the code.
    - "cmd/smoke-check/display_linux.go"
    - "cmd/smoke-check/display_other.go"
    - "cmd/smoke-check/libs_linux.go"
    - "cmd/smoke-check/libs_other.go"
    # Never compiled on the platform the tests run on, so no test on any Linux
    # runner can cover it. Its Unix counterpart is covered by
    # internal/simulator's own tests and is deliberately not excluded.
    - "internal/simulator/proc_windows.go"
