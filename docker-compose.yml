# Five services, differing only in how a human sees and hears the Simulator.
#
#   simulator             no profile. Headless under Xvfb; what an MCP client's
#                         `docker compose run` uses.
#   simulator-visual      profile: visual. Host X11 and PulseAudio. Linux only.
#   simulator-visual-wsl  profile: wsl. WSLg's display and audio. Untested on
#                         real Windows.
#   simulator-vnc         profile: vnc. Browser fallback, any OS.
#   simulator-shared      profile: shared. Long-lived, so an agent and a human
#                         drive the same Simulator.
#
# platform: linux/amd64 because Panic ships the Linux SDK for x86_64 only. Without
# it an arm64 host builds an arm64 image around the amd64 Go toolchain, and cgo
# fails with "gcc: unrecognized command-line option '-m64'".
services:
  simulator:
    platform: linux/amd64
    build:
      context: .
      args:
        PLAYDATE_SDK_VERSION: ${PLAYDATE_SDK_VERSION:-3.1.2}
    environment:
      - DISPLAY=:99
    command: ["bash", "-c", "Xvfb :99 -screen 0 1280x800x24 & sleep 1 && exec bash"]
    stdin_open: true
    tty: true

  simulator-visual:
    platform: linux/amd64
    build:
      context: .
      args:
        PLAYDATE_SDK_VERSION: ${PLAYDATE_SDK_VERSION:-3.1.2}
    profiles: ["visual"]
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - SDL_AUDIODRIVER=pulseaudio
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse:rw
    network_mode: host
    stdin_open: true
    tty: true

  # Run from inside a WSL2 distro's shell, where WSLg exports DISPLAY,
  # WAYLAND_DISPLAY and PULSE_SERVER.
  simulator-visual-wsl:
    platform: linux/amd64
    build:
      context: .
      args:
        PLAYDATE_SDK_VERSION: ${PLAYDATE_SDK_VERSION:-3.1.2}
    profiles: ["wsl"]
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER:-}
      - SDL_AUDIODRIVER=pulseaudio
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    stdin_open: true
    tty: true

  # No host display or audio integration: video over noVNC, audio as an MP3 stream.
  simulator-vnc:
    platform: linux/amd64
    build:
      context: .
      args:
        PLAYDATE_SDK_VERSION: ${PLAYDATE_SDK_VERSION:-3.1.2}
    profiles: ["vnc"]
    command: ["bash", "/workspace/scripts/run-vnc.sh"]
    # Loopback by default: x11vnc runs -nopw, and Docker's published ports bypass
    # ufw/firewalld. BIND_ADDR=0.0.0.0 opts in to remote access; SSH forwarding is safer.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6080:6080"
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    stdin_open: true
    tty: true

  # Runs detached so an MCP client can `docker compose exec` into the same
  # container a human watches over VNC; `docker compose run` would make a new one.
  simulator-shared:
    platform: linux/amd64
    build:
      context: .
      args:
        PLAYDATE_SDK_VERSION: ${PLAYDATE_SDK_VERSION:-3.1.2}
    profiles: ["shared"]
    environment:
      # Container-level, because an exec'd server isn't a child of run-vnc.sh and
      # its Simulator's audio must reach the same sink the VNC stream reads.
      - PULSE_SERVER=unix:/tmp/pulse-vnc/native
      - SDL_AUDIODRIVER=pulseaudio
    volumes:
      # Fixed at container start; changing games means recreating the container.
      - ${GAME_DIR:-.}:/your-game
      # The Simulator's Data directory, where saves and mcp/game_logs.jsonl land, so a
      # human can read them. SHARED_DATA_DIR keeps a test run's bundle IDs apart from yours.
      - ${SHARED_DATA_DIR:-./.shared-data}:/opt/playdate-sdk/Disk/Data
    command: ["bash", "/workspace/scripts/run-vnc.sh"]
    # Same loopback default as simulator-vnc, which matters more on a detached service.
    ports:
      # Overridable so shared-check.sh can run beside a session you're using.
      - "${BIND_ADDR:-127.0.0.1}:${VNC_PORT:-6080}:6080"
      - "${BIND_ADDR:-127.0.0.1}:${AUDIO_PORT:-8000}:8000"
